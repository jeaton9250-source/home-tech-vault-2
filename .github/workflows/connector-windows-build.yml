name: Connector Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - "connector-v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: connector/desktop/package-lock.json

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install connector dependencies
        working-directory: connector/desktop
        run: npm ci

      - name: Run connector typecheck
        working-directory: connector/desktop
        run: npm run typecheck

      - name: Run connector tests
        working-directory: connector/desktop
        run: npm test

      - name: Run cargo check
        working-directory: connector/desktop/src-tauri
        run: cargo check

      - name: Build Windows installer
        working-directory: connector/desktop
        env:
          VITE_HTV_API_BASE_URL: https://www.hometechvault.com
        run: npm run tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: connector-windows-installers
          path: |
            connector/desktop/src-tauri/target/release/bundle/nsis/*.exe
            connector/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Attach installers to GitHub release
        if: startsWith(github.ref, 'refs/tags/connector-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            connector/desktop/src-tauri/target/release/bundle/nsis/*.exe
            connector/desktop/src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
